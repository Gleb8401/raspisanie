<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151b2e">
<title>Пары СИСА-9</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232747d6'/%3E%3Crect x='7' y='9' width='18' height='3' rx='1.5' fill='%23f2b705'/%3E%3Crect x='7' y='15' width='18' height='3' rx='1.5' fill='white'/%3E%3Crect x='7' y='21' width='12' height='3' rx='1.5' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-first single column — status, "сейчас" card, week switcher, day strip, lesson list; week grid below */
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#151b2e; --muted:#5d6782; --line:#d9deea;
  --accent:#2747d6; --accent-soft:#e3e8fc; --now:#f2b705; --now-ink:#3a2c00; --past:#9aa3b8;
  --warn:#b4231b; --warn-soft:#fde6e3; --ok:#1f8a4c;
  --card:#151b2e; --card-fg:#eef1f6;
  --f-display:"Unbounded",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1320; --surface:#181e30; --ink:#e8ecf7; --muted:#97a1bd; --line:#2a3250;
  --accent:#8ea2ff; --accent-soft:#232c52; --now:#f5c330; --now-ink:#2a2000; --past:#5c6683;
  --warn:#ff8a7f; --warn-soft:#3a1d22; --ok:#5fd393; --card:#222b4d; --card-fg:#eef1fb; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1320; --surface:#181e30; --ink:#e8ecf7; --muted:#97a1bd; --line:#2a3250;
  --accent:#8ea2ff; --accent-soft:#232c52; --now:#f5c330; --now-ink:#2a2000; --past:#5c6683;
  --warn:#ff8a7f; --warn-soft:#3a1d22; --ok:#5fd393; --card:#222b4d; --card-fg:#eef1fb; color-scheme:dark}

*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:20px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,5vw,32px);margin:4px 0 0;letter-spacing:-.01em;text-wrap:balance}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.status .sd{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.status.bad{color:var(--warn)} .status.bad .sd{background:var(--warn)}
.status.stale .sd{background:var(--now)}

/* NOW card */
.status #statusText{flex:1;min-width:0}
.now{background:var(--card);color:var(--card-fg);border-radius:20px;padding:20px;display:grid;gap:14px}
.now .label{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:.8}
.dot{width:9px;height:9px;border-radius:50%;background:var(--now);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--now) 70%,transparent)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.now-main{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:flex-end}
.now-title{font-family:var(--f-display);font-weight:500;font-size:clamp(20px,4.6vw,28px);line-height:1.15;margin:0;text-wrap:balance}
.now-sub{opacity:.75;margin-top:6px;font-size:14px}
.now-room{text-align:right}
.now-room .r{font-family:var(--f-mono);font-weight:700;font-size:clamp(30px,8vw,44px);line-height:1;color:var(--now)}
.now-room .rl{font-size:12px;opacity:.7;text-transform:uppercase;letter-spacing:.08em}
.bar{height:6px;background:color-mix(in srgb,var(--card-fg) 18%,transparent);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--now);border-radius:99px;transition:width .6s}
.now-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px}
.big{font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums}

/* week switcher */
.weeknav{display:flex;align-items:center;gap:10px}
.weeknav button{appearance:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer;flex:none}
.weeknav button:disabled{opacity:.35;cursor:default}
.weeknav .wl{flex:1;min-width:0;text-align:center;display:grid}
.weeknav .wl b{font-family:var(--f-display);font-weight:500;font-size:17px}
.weeknav .wl span{font-size:13px;color:var(--muted)}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.tab{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:8px 2px;
  display:grid;gap:2px;justify-items:center;cursor:pointer;font:inherit;min-width:0}
.tab .wd{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tab .dn{font-family:var(--f-display);font-weight:500;font-size:18px}
.tab .cnt{display:flex;gap:3px;height:6px;align-items:center}
.tab .cnt i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.tab .cnt i.ch{background:var(--warn)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tab[aria-selected="true"] .wd{color:#fff;opacity:.85}
.tab[aria-selected="true"] .cnt i{background:#fff}
.tab.today:not([aria-selected="true"]){border-color:var(--accent);border-width:2px}
.tab.off{opacity:.55}
button:focus-visible,a:focus-visible{outline:3px solid var(--now);outline-offset:2px}

/* day list */
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.dayhead h2{font-family:var(--f-display);font-weight:500;font-size:20px;margin:0}
.dayhead span{color:var(--muted);font-size:14px}
.list{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.lesson{display:grid;grid-template-columns:74px 1fr auto;gap:14px;padding:14px 16px;align-items:center;border-top:1px solid var(--line);position:relative}
.lesson:first-child{border-top:0}
.time{display:grid;gap:1px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.time .n{font-size:11px;color:var(--muted);font-family:var(--f-body);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.time .s{font-weight:700;font-size:16px}
.time .e{color:var(--muted);font-size:13px}
.info{min-width:0}
.subj{font-weight:700;font-size:16px;line-height:1.25}
.code{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:500;margin-right:6px;white-space:nowrap}
.meta{color:var(--muted);font-size:13.5px;margin-top:3px;display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 7px}
.tag.ch{background:var(--warn-soft);color:var(--warn)}
.tag.nowt{background:var(--now);color:var(--now-ink)}
.room{font-family:var(--f-mono);font-weight:700;font-size:20px;text-align:right;white-space:nowrap}
.room small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.lesson.past .subj,.lesson.past .time .s,.lesson.past .room{color:var(--past)}
.lesson.cur{background:color-mix(in srgb,var(--now) 16%,var(--surface))}
.lesson.cur::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--now)}
.lesson.changed::after{content:"";position:absolute;right:0;top:0;bottom:0;width:4px;background:var(--warn)}
.gap{padding:6px 16px 6px 104px;font-size:12.5px;color:var(--muted);background:var(--bg);border-top:1px solid var(--line)}
.gap.long{font-weight:600;color:var(--ink)}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:var(--f-display);font-weight:500;color:var(--ink);font-size:18px;margin-bottom:4px}

/* week grid */
.section-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.section-h h2{font-family:var(--f-display);font-weight:500;font-size:20px;margin:0}
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:10px;vertical-align:top;text-align:left}
th:last-child,td:last-child{border-right:0} tr:last-child td{border-bottom:0}
thead th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;background:var(--bg)}
thead th.today{color:var(--accent)}
td.slot{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;width:80px}
td.slot b{display:block;color:var(--ink);font-size:14px}
.cell{display:grid;gap:2px}
.cell .t{font-weight:700;font-size:13.5px;line-height:1.25}
.cell .m{font-size:12px;color:var(--muted)}
.cell .r{font-family:var(--f-mono);font-size:12.5px;font-weight:700;color:var(--accent)}
td.cur{background:color-mix(in srgb,var(--now) 18%,var(--surface))}
td.todaycol{background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
td.chg{box-shadow:inset 3px 0 0 var(--warn)}

.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.sj{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.sj .nm{font-weight:600;font-size:14px}
.sj .tc{font-size:12px;color:var(--muted)}
.sj .k{font-family:var(--f-mono);font-weight:700;color:var(--accent);white-space:nowrap}

footer{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between}
footer a{color:var(--accent)}

@media (max-width:520px){
  .lesson{grid-template-columns:58px 1fr auto;gap:10px;padding:12px}
  .gap{padding-left:80px}
  .room{font-size:17px}
  .tab .dn{font-size:16px}
  .now{padding:16px;border-radius:16px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Колледж · корпус «Рижский»</div>
      <h1>01-26.СИСА.ОФ.9</h1>
    </div>
    <div class="status" id="status"><span class="sd"></span><span id="statusText">Показываю сохранённое расписание</span></div>
  </header>

  <section class="now" id="now" aria-live="polite"></section>

  <div class="weeknav">
    <button id="prevW" aria-label="Предыдущая неделя">‹</button>
    <div class="wl"><b id="weekRange"></b><span id="weekType"></span></div>
    <button id="nextW" aria-label="Следующая неделя">›</button>
  </div>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Дни недели"></nav>

  <section style="display:grid;gap:10px">
    <div class="dayhead"><h2 id="dayTitle"></h2><span id="daySum"></span></div>
    <div class="list" id="list"></div>
  </section>

  <section style="display:grid;gap:10px">
    <div class="section-h"><h2>Вся неделя</h2><span class="eyebrow">листается вбок на телефоне</span></div>
    <div class="gridwrap"><table id="grid"></table></div>
  </section>

  <section style="display:grid;gap:10px" id="subjSec">
    <div class="section-h"><h2>Предметы за неделю</h2><span class="eyebrow">пар · преподаватель</span></div>
    <div class="subjects" id="subjects"></div>
  </section>

  <footer>
    <span>Источник: <a href="https://site.mstimetables.ru/01a00f53d32773b5b396bf3eb6f57ce2/groups/249" target="_blank" rel="noopener">mstimetables.ru, группа 249</a> · проверяется раз в час</span>
    <span>Поток: 05-26.РИУПО.ОФ.9, 06-26.РИУПО.ОФ.9, 01-26.СИСА.ОФ.9</span>
  </footer>
</div>

<script>
// Запасная копия на случай, если база недоступна. Свежие данные приходят из db: schedule/data и schedule/meta.
const FALLBACK = null;
let DATA = FALLBACK, META = null;

const SLOTS = [["09:00","10:30"],["10:40","12:10"],["12:40","14:10"],["14:20","15:50"],["16:00","17:30"],["17:40","19:10"]];
const WD = ["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
const WDS = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const MON = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MONS = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];

const toDate=(d,t)=>{const [y,m,dd]=d.split("-").map(Number);const [h,mi]=(t||"00:00").split(":").map(Number);return new Date(y,m-1,dd,h,mi)};
const iso=dt=>`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
const addDays=(d,n)=>{const x=toDate(d);x.setDate(x.getDate()+n);return iso(x)};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plural=(n,a,b,c)=>{const m10=n%10,m100=n%100;return m10===1&&m100!==11?a:(m10>=2&&m10<=4&&(m100<10||m100>=20)?b:c)};
const dur=min=>{min=Math.max(0,Math.round(min));const h=Math.floor(min/60),m=min%60;return h?`${h} ч ${m} мин`:`${m} мин`};
const fmtDay=d=>{const dt=toDate(d);return `${dt.getDate()} ${MON[dt.getMonth()]}`};
const roomLabel=r=>/^\d/.test(r)?"каб.":"";
const hm=dt=>`${String(dt.getHours()).padStart(2,"0")}:${String(dt.getMinutes()).padStart(2,"0")}`;
const fmtStamp=s=>{const d=new Date(s);if(isNaN(d))return"";const t=iso(new Date());
  return iso(d)===t?`сегодня в ${hm(d)}`:`${d.getDate()} ${MONS[d.getMonth()]} в ${hm(d)}`};
const splitSubj=s=>{const m=String(s).match(/^([А-ЯA-Z]{1,4}\.\d+)\s+(.*)$/);return m?{code:m[1],name:m[2]}:{code:"",name:String(s)}};
const withLabel=w=>{if(!w)return"";const codes=[...new Set([...w.matchAll(/\.([А-ЯA-Z]{2,})\./g)].map(m=>m[1]))];return codes.length?`поток с ${codes.join(", ")}`:"общий поток"};

let L=[], WEEKS=[], wIdx=0, selected=null, userPicked=false;
function build(){
  WEEKS = DATA&&DATA.weeks ? Object.keys(DATA.weeks).sort() : [];
  L = [];
  WEEKS.forEach(w=>(DATA.weeks[w].lessons||[]).forEach(l=>{
    const sj=splitSubj(l.subj);
    L.push({...l,...sj,week:w,start:toDate(l.date,l.s),end:toDate(l.date,l.e),
      num:(SLOTS.findIndex(x=>x[0]===l.s)+1)||"",changed:l.repl&&l.repl!=="none",withL:withLabel(l.with)});
  }));
  L.sort((a,b)=>a.start-b.start);
}
const byDay=d=>L.filter(l=>l.date===d);
const weekDays=w=>[...Array(7)].map((_,i)=>addDays(w,i));

function pickDefaults(){
  const today=iso(new Date());
  let i=WEEKS.findIndex(w=>today>=w&&today<=addDays(w,6));
  if(i<0) i=0;
  // в выходные после последней пары — сразу показать следующую неделю, если она уже есть
  const next=L.find(l=>l.start>new Date());
  if(next && WEEKS.indexOf(next.week)>i && !byDay(today).length && toDate(today).getDay()%6===0) i=WEEKS.indexOf(next.week);
  wIdx=i;
  const days=weekDays(WEEKS[wIdx]||today);
  selected = days.includes(today)?today:(days.find(d=>byDay(d).length)||days[0]);
}

function renderStatus(){
  const el=document.getElementById("status"), tx=document.getElementById("statusText");
  el.className="status";
  if(!META&&!DATA){tx.textContent="Загружаю расписание…";return}
  if(!META){tx.textContent=DATA&&DATA.changedAt?`Сохранённая копия от ${fmtStamp(DATA.changedAt)}`:"Сохранённая копия";return}
  const chk=new Date(META.checkedAt), ageH=(Date.now()-chk)/36e5;
  const changed=DATA&&DATA.changedAt?` · последнее изменение ${fmtStamp(DATA.changedAt)}`:"";
  if(META.ok===false){el.classList.add("bad");tx.textContent=`Не удалось проверить сайт ${fmtStamp(META.checkedAt)}. Показываю последнее известное расписание`;return}
  if(ageH>3){el.classList.add("stale");tx.textContent=`Проверено ${fmtStamp(META.checkedAt)} — давно, автообновление могло остановиться${changed}`;return}
  tx.textContent=`Сверено с сайтом ${fmtStamp(META.checkedAt)}${changed}`;
}

function renderNow(now,today){
  const cur=L.find(l=>l.start<=now&&now<l.end), next=L.find(l=>l.start>now), el=document.getElementById("now");
  const chg=l=>l.changed?` · <b>изменение в расписании</b>`:"";
  if(cur){
    const p=(now-cur.start)/(cur.end-cur.start)*100, left=(cur.end-now)/6e4;
    el.innerHTML=`<span class="label"><span class="dot"></span>Сейчас идёт${cur.num?` · ${cur.num} пара`:""}</span>
      <div class="now-main"><div style="min-width:0"><p class="now-title">${esc(cur.name)}</p>
      <div class="now-sub">${esc(cur.teacher)}${cur.withL?` · ${esc(cur.withL)}`:""}${chg(cur)}</div></div>
      <div class="now-room"><div class="rl">${roomLabel(cur.room)||"&nbsp;"}</div><div class="r">${esc(cur.room||"—")}</div></div></div>
      <div class="bar"><i style="width:${p.toFixed(1)}%"></i></div>
      <div class="now-foot"><span class="big">${cur.s}–${cur.e}</span><span>до конца <span class="big">${dur(left)}</span></span></div>
      ${next&&next.date===cur.date?`<div class="now-sub">Потом: ${esc(next.name)} · ${esc(next.room)} в ${next.s}</div>`:`<div class="now-sub">Это последняя пара сегодня</div>`}`;
  } else if(next){
    const mins=(next.start-now)/6e4, sameDay=next.date===today, tomorrow=addDays(today,1);
    const when=sameDay?`через <span class="big">${dur(mins)}</span>`:
      `${next.date===tomorrow?"завтра":WD[(toDate(next.date).getDay()+6)%7].toLowerCase()+", "+fmtDay(next.date)} в <span class="big">${next.s}</span>`;
    const label=sameDay?(byDay(today).some(l=>l.end<=now)?"Перемена · дальше":"Сегодня первая"):(byDay(today).length?"На сегодня всё · следующая":"Сегодня пар нет · следующая");
    el.innerHTML=`<span class="label"><span class="dot"></span>${label}</span>
      <div class="now-main"><div style="min-width:0"><p class="now-title">${esc(next.name)}</p>
      <div class="now-sub">${esc(next.teacher)}${next.num?` · ${next.num} пара`:""}${next.withL?` · ${esc(next.withL)}`:""}${chg(next)}</div></div>
      <div class="now-room"><div class="rl">${roomLabel(next.room)||"&nbsp;"}</div><div class="r">${esc(next.room||"—")}</div></div></div>
      <div class="now-foot"><span>${when}</span><span class="big">${next.s}–${next.e}</span></div>`;
  } else {
    el.innerHTML=`<span class="label"><span class="dot"></span>Пар впереди не видно</span>
      <p class="now-title">Следующую неделю на сайте ещё не опубликовали</p>
      <div class="now-sub">Страница проверяет сайт каждый час и покажет её сразу, как появится.</div>`;
  }
}

function render(){
  const now=new Date(), today=iso(now);
  renderStatus(); renderNow(now,today);
  if(!WEEKS.length){document.getElementById("list").innerHTML=`<div class="empty"><b>Загружаю…</b>Расписание скоро появится.</div>`;return}
  const w=WEEKS[wIdx], days=weekDays(w), wl=L.filter(l=>l.week===w), type=DATA.weeks[w].type;
  document.getElementById("weekRange").textContent=`${toDate(w).getDate()} ${MONS[toDate(w).getMonth()]} – ${fmtDay(addDays(w,6))}`;
  const isCur=today>=w&&today<=addDays(w,6);
  document.getElementById("weekType").textContent=[isCur?"эта неделя":(w>today?"впереди":"прошла"),type?`${type}`:"",wl.length?`${wl.length} ${plural(wl.length,"пара","пары","пар")}`:"не опубликована"].filter(Boolean).join(" · ");
  document.getElementById("prevW").disabled=wIdx===0;
  document.getElementById("nextW").disabled=wIdx>=WEEKS.length-1;
  if(!days.includes(selected)) selected=days.includes(today)?today:(days.find(d=>byDay(d).length)||days[0]);

  document.getElementById("tabs").innerHTML=days.map((d,i)=>{const dl=byDay(d);
    return `<button class="tab${d===today?" today":""}${dl.length?"":" off"}" role="tab" aria-selected="${d===selected}" data-d="${d}">
      <span class="wd">${WDS[i]}</span><span class="dn">${toDate(d).getDate()}</span>
      <span class="cnt">${dl.map(l=>`<i${l.changed?' class="ch"':""}></i>`).join("")}</span></button>`}).join("");

  const dl=byDay(selected), idx=days.indexOf(selected);
  document.getElementById("dayTitle").textContent=`${WD[idx]}, ${fmtDay(selected)}${selected===today?" · сегодня":""}`;
  document.getElementById("daySum").textContent=dl.length?`${dl.length} ${plural(dl.length,"пара","пары","пар")} · ${dl[0].s}–${dl[dl.length-1].e}`:"";
  let html="";
  dl.forEach((l,i)=>{
    if(i){const g=Math.round((l.start-dl[i-1].end)/6e4);if(g>0)html+=`<div class="gap${g>=20?" long":""}">${g>=20?"Большая перемена":"Перемена"} · ${g} мин</div>`}
    const st=now>=l.end?" past":(now>=l.start?" cur":"");
    html+=`<div class="lesson${st}${l.changed?" changed":""}"><div class="time"><span class="n">${l.num?l.num+" пара":"&nbsp;"}</span><span class="s">${l.s}</span><span class="e">${l.e}</span></div>
      <div class="info"><div class="subj">${l.code?`<span class="code">${esc(l.code)}</span>`:""}${esc(l.name)}</div>
      <div class="meta"><span>${esc(l.teacher)}</span>${l.type?`<span class="tag">${esc(l.type)}</span>`:""}${l.sub?`<span class="tag">п/г ${esc(l.sub)}</span>`:""}${l.withL?`<span class="tag">${esc(l.withL)}</span>`:""}${l.changed?`<span class="tag ch">изменение</span>`:""}${st===" cur"?`<span class="tag nowt">идёт сейчас</span>`:""}</div></div>
      <div class="room"><small>${roomLabel(l.room)||"&nbsp;"}</small>${esc(l.room||"—")}</div></div>`;
  });
  document.getElementById("list").innerHTML=html||(wl.length?`<div class="empty"><b>Выходной</b>Пар в этот день нет.</div>`:`<div class="empty"><b>Неделя ещё не опубликована</b>Как только колледж выложит расписание, оно появится здесь.</div>`);

  const gd=days.filter((d,i)=>i<5||byDay(d).length);
  const slots=SLOTS.filter(([s])=>wl.some(l=>l.s===s)||SLOTS.indexOf(SLOTS.find(x=>x[0]===s))<4);
  const extra=[...new Set(wl.filter(l=>!SLOTS.some(x=>x[0]===l.s)).map(l=>l.s+"|"+l.e))].map(x=>x.split("|"));
  const allSlots=[...slots,...extra].sort((a,b)=>a[0].localeCompare(b[0]));
  let t=`<thead><tr><th>Пара</th>${gd.map(d=>`<th class="${d===today?"today":""}">${WDS[days.indexOf(d)]} ${toDate(d).getDate()}${d===today?" · сегодня":""}</th>`).join("")}</tr></thead><tbody>`;
  allSlots.forEach(([s,e])=>{
    const n=SLOTS.findIndex(x=>x[0]===s)+1;
    t+=`<tr><td class="slot"><b>${n||"·"}</b>${s}–${e}</td>`;
    gd.forEach(d=>{const ls=wl.filter(x=>x.date===d&&x.s===s);
      const c=[ls.some(l=>now>=l.start&&now<l.end)?"cur":(d===today?"todaycol":""),ls.some(l=>l.changed)?"chg":""].join(" ");
      t+=`<td class="${c}">${ls.map(l=>`<div class="cell"><span class="t">${esc(l.name)}${l.sub?` · п/г ${esc(l.sub)}`:""}</span><span class="m">${esc(l.teacher)}</span><span class="r">${esc(l.room)}</span></div>`).join("")}</td>`});
    t+=`</tr>`;
  });
  document.getElementById("grid").innerHTML=t+"</tbody>";

  const map={};wl.forEach(l=>{(map[l.name]=map[l.name]||{n:0,t:l.teacher}).n++});
  document.getElementById("subjSec").hidden=!wl.length;
  document.getElementById("subjects").innerHTML=Object.entries(map).sort((a,b)=>b[1].n-a[1].n||a[0].localeCompare(b[0],"ru"))
    .map(([k,v])=>`<div class="sj"><div style="min-width:0"><div class="nm">${esc(k)}</div><div class="tc">${esc(v.t)}</div></div><span class="k">${v.n}</span></div>`).join("");
}

document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;selected=b.dataset.d;userPicked=true;render()});
document.getElementById("prevW").addEventListener("click",()=>{if(wIdx>0){wIdx--;selected=null;userPicked=true;render()}});
document.getElementById("nextW").addEventListener("click",()=>{if(wIdx<WEEKS.length-1){wIdx++;selected=null;userPicked=true;render()}});

build(); pickDefaults(); render();
setInterval(render,30000);

// Свежие данные: data.json и meta.json обновляет GitHub Actions раз в час
async function load(){
  try{
    const [d,m]=await Promise.all([
      fetch("data.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null),
      fetch("meta.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null)
    ]);
    if(m) META=m;
    if(d&&d.weeks&&(!DATA||d.hash!==DATA.hash)){
      const curWeek=WEEKS[wIdx], curSel=selected;
      DATA=d; build();
      if(userPicked&&WEEKS.includes(curWeek)){wIdx=WEEKS.indexOf(curWeek);selected=curSel}else pickDefaults();
    }
    render();
  }catch(e){
    if(!DATA){document.getElementById("statusText").textContent="Не удалось загрузить расписание. Проверь интернет и обнови страницу"}
  }
}
load();
setInterval(load,10*60*1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script>
